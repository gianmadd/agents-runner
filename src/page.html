<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start a session</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f3; --fg: #1c1917; --muted: #78716c; --faint: #a8a29e; --line: #e7e5e4; --card: #fff; --hover: #f3f2f0;
    --track: #ebe9e7; --hot: #dc2626;
  }
  /* Dark follows the system until the toggle picks a theme for this window. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141210; --fg: #f5f5f4; --muted: #a8a29e; --faint: #78716c; --line: #2e2a27; --card: #1f1c1a; --hover: #29251f;
      --track: #34302d; --hot: #f87171;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141210; --fg: #f5f5f4; --muted: #a8a29e; --faint: #78716c; --line: #2e2a27; --card: #1f1c1a; --hover: #29251f;
    --track: #34302d; --hot: #f87171;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  /* Each account sets --c inline (tint() in the script); its soft shade follows the theme. */
  [style*="--c"] { --cs: color-mix(in srgb, var(--c) 15%, var(--card)); }

  h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .repo { font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .faint { color: var(--faint); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .theme { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 15px; line-height: 1; flex: none; }
  .theme:hover { color: var(--fg); }
  .refresh { float: right; padding: 0 4px; border: 0; background: none; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer; }
  .refresh:hover { color: var(--fg); }

  /* Two panes: what starts on the left, the sessions to pick from on the right; each scrolls on its own. */
  .split { display: grid; grid-template-columns: 1fr 380px; height: 100%; }
  .detail { display: flex; flex-direction: column; min-height: 0; }
  .detail .scroll { flex: 1; overflow: auto; padding: 22px 26px; display: grid; gap: 22px; align-content: start; }
  .pane { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .pane .hd { padding: 16px; display: grid; gap: 10px; }
  .pane .top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
  .pane .scroll { flex: 1; overflow: auto; padding: 0 8px 12px; }
  .bigt { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; margin: 0; line-height: 1.3; }

  /* Segmented pickers, used everywhere instead of dropdowns */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--hover); border-radius: 9px; }
  .seg button { border: 0; background: none; padding: 3px 9px; border-radius: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed="true"] { background: var(--cs, var(--card)); color: var(--c, var(--fg)); font-weight: 700; }
  .seg .grp { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .seg .grp + .grp { margin-left: 4px; padding-left: 7px; border-left: 1px solid var(--line); }
  .seg .who { font-size: 11px; color: var(--c); font-weight: 600; padding: 0 3px 0 4px; }
  .field { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field > span { font-size: 12px; color: var(--muted); width: 52px; }

  /* Account cards */
  .accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .acc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; width: 100%; text-align: left; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  button.acc:hover { border-color: var(--faint); }
  .acc.lead { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
  .acc .name { display: flex; align-items: center; gap: 7px; }
  .acc .name b { white-space: nowrap; }
  .acc .name .faint { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-tag { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0 8px; border-radius: 99px; }
  .role-tag.lead { background: var(--c); color: #fff; }
  .role-tag.ext { background: var(--cs); color: var(--c); }
  .wins { display: grid; gap: 5px; }
  .win { display: grid; grid-template-columns: 22px 1fr 34px; gap: 0 8px; align-items: center; font-size: 12px; }
  .win .lbl { color: var(--muted); }
  .win .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .win .pct.hot, .win .note.hot { color: var(--hot); }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
  .bar i.hot { background: var(--hot); }
  .win .when { grid-column: 2 / -1; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Workers */
  .wrow { display: grid; grid-template-columns: 120px 1fr auto; gap: 6px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .wrow .role { font-weight: 600; }
  .wrow .role input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 3px 8px; font-weight: 600; }
  .wrow .role small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; }
  .wrow .runs { grid-column: 2; justify-self: start; display: flex; flex-wrap: wrap; gap: 8px; }
  .wrow .eff { grid-column: 2; justify-self: start; }
  .wrow > .seg { justify-self: start; }
  .wrow:last-child { border-bottom: 0; }
  .x { grid-row: 1; grid-column: 3; border: 0; background: none; color: var(--faint); padding: 4px 6px; }
  .x:hover { color: var(--hot); }
  .tools { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; }
  .tools .field > span { width: auto; white-space: nowrap; }
  .add { border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 3px 12px; color: var(--muted); }
  .locked { display: flex; gap: 10px; align-items: center; padding: 12px 14px; color: var(--muted); font-size: 13px; }
  .link { margin-left: auto; border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }

  /* Start bar */
  .go { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px 26px; border-top: 1px solid var(--line); background: var(--card); }
  .warn { color: var(--hot); font-weight: 600; }
  #status { color: var(--hot); font-size: 12px; }
  #status:empty { display: none; }
  #start { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 9px; padding: 7px 18px;
    font-size: 14px; font-weight: 600; color: var(--c, var(--bg)); background: var(--cs, var(--fg)); white-space: nowrap; transition: filter .15s, transform .05s; }
  #start:hover { filter: brightness(.97); }
  #start:active { transform: translateY(1px); }
  #start .kbd { font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .7; }

  /* Session list */
  .search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: none; border-radius: 99px; padding: 1px 10px; font-size: 12px; color: var(--muted); }
  /* Picked: "All" in the theme's own card color, an account in its color like a pressed picker. */
  .chips button.on { background: var(--card); color: var(--fg); border-color: var(--faint); font-weight: 600; }
  .chips button.on[style*="--c"] { background: var(--c); border-color: var(--c); color: #fff; }
  .chips button.on .dot { background: #fff; }
  .day { font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 12px 8px 4px; }
  .item { display: grid; grid-template-columns: 12px 1fr auto; gap: 0 10px; align-items: center; width: 100%; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--cs); }
  .item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.on .title { font-weight: 600; }
  .item .meta { grid-column: 2 / -1; font-size: 12px; color: var(--faint); }
  .item .ago { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .item.new { grid-template-columns: 22px 1fr auto; padding: 9px 8px; }
  .plus { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 700; }
  .empty { padding: 12px 8px; color: var(--faint); font-size: 13px; }

  /* Spotlight: typing anywhere opens it; an account name and ⏎ start a new session there with its saved table. */
  .spot { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, var(--fg) 25%, transparent); display: grid; justify-items: center; align-items: start; padding: 16vh 16px 0; }
  .spot-box { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); overflow: hidden; }
  .spot input { width: 100%; border: 0; background: none; padding: 16px 18px; font-size: 20px; outline: none; }
  .spot-list { border-top: 1px solid var(--line); padding: 6px; display: grid; gap: 2px; }
  .spot-item { display: grid; grid-template-columns: 12px auto 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px; background: none; text-align: left; }
  .spot-item.on { background: var(--cs); }
  .spot-item .faint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spot-foot { padding: 8px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }

  @media (max-width: 760px) {
    html, body { height: auto; }
    .split { grid-template-columns: 1fr; height: auto; }
    .pane { border-left: 0; border-top: 1px solid var(--line); order: -1; }
    .detail .scroll { padding: 18px 16px; }
    .go { position: sticky; bottom: 0; padding: 12px 16px; }
    .wrow { grid-template-columns: 1fr auto; }
    .wrow .eff, .wrow .runs { grid-column: 1 / -1; }
    .x { grid-column: 2; }
  }
</style>
</head>
<body>
<div class="split">
  <main class="detail">
    <div class="scroll" id="detail"></div>
    <div class="go"><span id="status"></span><button id="start"><span id="startLabel">Start</span><span class="kbd">⏎</span></button></div>
  </main>
  <aside class="pane">
    <div class="hd">
      <div class="top"><div><h1>Start a session</h1><span class="repo" id="repo"></span></div><button class="theme" id="theme" type="button"></button></div>
      <input class="search" id="q" placeholder="Search sessions" spellcheck="false" aria-label="Search sessions">
      <div class="chips" id="chips"></div>
    </div>
    <div class="scroll" id="list"><div class="empty">Reading…</div></div>
  </aside>
</div>
<div class="spot" id="spot" hidden>
  <div class="spot-box">
    <input id="spotq" spellcheck="false" autocomplete="off" aria-label="Account to start on">
    <div class="spot-list" id="spotlist"></div>
    <div class="spot-foot">⏎ new session with the saved workers · esc to close</div>
  </div>
</div>

<script>
const S = __STATE__;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const OTHER = {claude: 'codex', codex: 'claude'};
const short = m => m.replace(/^gpt-[\d.]+-/, '').replace('[1m]', ' 1M').replace(/^./, c => c.toUpperCase());  // gpt-6-luna → Luna, opus[1m] → Opus 1M
// One color per account: Claude subscriptions on the yellow-red range, Codex ones on blues.
const PALETTE = {claude: ['#d97757', '#c48a06', '#c2410c', '#a16207'], codex: ['#3b82f6', '#6366f1', '#0891b2']};
const tint = (e, p, i) => { e.style.setProperty('--c', PALETTE[p][i % PALETTE[p].length]); return e; };
let prov = null, leadIdx = 0, resume = null, update = false, sessions = null, filter = 'all';
const lead = {model: null, effort: null};
const quota = {};  // `${p}|${i}` → windows, or {error}, once read
const ext = () => S.accounts[OTHER[prov]];
const extIndex = () => Math.max(0, ext().findIndex(a => a.folder === table().account));  // the lead account's table names it
const extName = () => (ext()[extIndex()] || {name: OTHER[prov]}).name;
const leadName = () => S.accounts[prov][leadIdx].name;
const accName = (p, i) => (S.accounts[p][i] || {name: p}).name;
const provOf = runs => runs === 'native' ? prov : OTHER[prov];
const accOf = runs => runs === 'native' ? leadIdx : extIndex();
// A Claude lead with the codex plugin runs Codex as subagents it follows up with: the implementer may run there too.
const subagents = () => prov === 'claude' && !!S.subagents[S.accounts.claude[leadIdx]?.name];
const table = () => S.tables[leadName()];  // one table per lead account: claude and claude-work can route differently
$('repo').textContent = S.repo;

// Theme: the system's at open; the toggle overrides it for this window only.
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => (document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light')) === 'dark';
function paintToggle() {
  $('theme').textContent = isDark() ? '☀' : '☾';
  $('theme').ariaLabel = isDark() ? 'Light theme' : 'Dark theme';
}
$('theme').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; paintToggle(); };
systemDark.addEventListener('change', paintToggle);
paintToggle();

// A segmented picker: groups of options, one value pressed; a group with an account takes that account's color.
function seg(groups, value, onPick) {
  const box = el('div', 'seg');
  for (const g of groups) {
    const wrap = el('span', 'grp');
    if (g.acc) tint(wrap, ...g.acc);
    if (g.who) wrap.append(el('span', 'who', g.who));
    for (const o of g.options) {
      const b = el('button', null, o.label ?? o.value);
      b.type = 'button';
      b.setAttribute('aria-pressed', o.value === value);
      b.onclick = () => onPick(o.value);
      wrap.append(b);
    }
    box.append(wrap);
  }
  return box;
}
const opts = list => list.map(v => ({value: v, label: short(v)}));  // models
const plain = list => list.map(v => ({value: v}));  // efforts, as they are
function section(title, ...children) {
  const s = el('section');
  s.append(el('h2', null, title), ...children);
  return s;
}

// --- Quota: read once per account, painted on every card of that account ---
function left(epoch) {
  let m = Math.max(0, Math.round((epoch * 1000 - Date.now()) / 60000));
  const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); m %= 60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
const when = epoch => new Date(epoch * 1000).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
const resetText = epoch => `in ${left(epoch)} · ${when(epoch)}`;
setInterval(() => document.querySelectorAll('[data-reset]').forEach(e => { e.textContent = resetText(+e.dataset.reset); }), 30000);
const peak = (p, i) => Math.max(0, ...((Array.isArray(quota[`${p}|${i}`]) && quota[`${p}|${i}`]) || []).map(w => w.used));

// Two fixed rows (5h, 7d) from the start, so the card keeps its size when the quota arrives.
function wins(p, i) {
  const q = quota[`${p}|${i}`], box = el('div', 'wins');
  box.dataset.q = `${p}|${i}`;
  const read = Array.isArray(q) && q.length ? q : null;
  for (const label of ['5h', '7d']) {
    const w = read && read.find(x => x.label === label);
    const row = el('div', 'win'), bar = el('div', 'bar'), fill = el('i');
    fill.style.width = w ? Math.min(100, w.used) + '%' : '0';
    if (w && w.used >= 90) fill.className = 'hot';
    bar.append(fill);
    const at = el('div', 'when');
    if (w && w.resets) { const t = el('span', null, resetText(w.resets)); t.dataset.reset = w.resets; at.append(t); }
    else { at.textContent = q === undefined ? 'reading…' : read ? '' : 'quota n/a'; if (q && q.error) at.title = q.error; }
    // A per-model weekly limit (e.g. "7d Fable") goes on the 7d line.
    if (label === '7d' && read) for (const n of read.filter(x => !['5h', '7d'].includes(x.label))) at.append(el('span', n.used >= 90 ? 'note hot' : 'note', ` · ${n.label.replace(/^7d /, '')} ${Math.round(n.used)}%`));
    row.append(el('span', 'lbl', label), bar, el('span', 'pct' + (w && w.used >= 90 ? ' hot' : ''), w ? `${Math.round(w.used)}%` : q === undefined ? '–' : 'n/a'), at);
    box.append(row);
  }
  return box;
}
// Read every account's quota; the ↻ button reads them all again.
const readQuotas = () => { for (const p of ['claude', 'codex']) S.accounts[p].forEach((_, i) => {
  const done = q => { quota[`${p}|${i}`] = q; document.querySelectorAll(`[data-q="${p}|${i}"]`).forEach(b => b.replaceWith(wins(p, i))); };
  done(undefined);
  fetch(`quota/${p}/${i}`).then(r => r.json()).then(q => done(q.error ? {error: q.error} : q.windows)).catch(() => done({error: ''}));
}); };
readQuotas();
// A section of account cards gets a ↻ next to its title that reads every quota again.
function withRefresh(sec) {
  const b = el('button', 'refresh', '↻');
  b.type = 'button'; b.title = b.ariaLabel = 'Refresh quotas'; b.onclick = readQuotas;
  sec.querySelector('h2').append(b);
  return sec;
}

// An account card: a button that makes it the lead for a new session, or a plain card when it can't change.
function card(p, i, pick) {
  const c = tint(el(pick ? 'button' : 'div', 'acc'), p, i);
  const isLead = p === prov && i === leadIdx, isExt = p !== prov && i === extIndex();
  c.classList.toggle('lead', isLead);
  if (pick) { c.type = 'button'; c.setAttribute('aria-pressed', isLead); c.onclick = () => selectLead(p, i); }
  const name = el('div', 'name');
  name.append(el('span', 'dot'), el('b', null, S.accounts[p][i].name), el('span', 'faint', p === 'codex' ? 'Codex' : 'Claude Code'),
    el('span', 'role-tag' + (isLead ? ' lead' : isExt ? ' ext' : ''), isLead ? 'lead' : isExt ? 'external' : ''));
  c.append(name, wins(p, i));
  return c;
}

// --- Left pane: what starts ---
function renderDetail() {
  const box = $('detail');
  box.replaceChildren();
  if (resume) {
    const head = el('div');
    head.append(el('p', 'bigt', resume.title), el('span', 'faint', `last active ${ago(resume.time)}`));
    const runs = card(prov, leadIdx, false);
    runs.style.maxWidth = '440px';
    box.append(head, withRefresh(section('Runs on', runs)), section('Workers', update ? workers() : locked()));
  } else {
    const accs = el('div', 'accs');
    for (const p of ['claude', 'codex']) S.accounts[p].forEach((_, i) => accs.append(card(p, i, true)));
    const model = el('div', 'card');  // laid out like the workers table below
    const models = Object.keys(S.leads[prov]), efforts = S.leads[prov][lead.model];
    const row = (label, picker) => { const f = el('div', 'wrow'); f.append(el('div', 'role', label), picker); return f; };
    model.append(
      row('Model', seg([{acc: [prov, leadIdx], options: opts(models)}], lead.model, m => { lead.model = m; fixLead(); renderDetail(); })),
      row('Effort', seg([{acc: [prov, leadIdx], options: plain(efforts)}], lead.effort, e => { lead.effort = e; renderDetail(); })));
    box.append(el('p', 'bigt', 'New session'), withRefresh(section('Lead account', accs)), section('Lead model', model),
      section('Workers', workers()));
  }
  tint($('start'), prov, leadIdx);
  $('startLabel').textContent = resume ? 'Resume' : 'Start';
}
function locked() {
  const box = el('div', 'card locked'), change = el('button', 'link', 'Change for this resume');
  change.type = 'button';
  change.onclick = () => { update = true; renderDetail(); };
  box.append('Same workers as when this session started', change);
  return box;
}
function fixLead() {
  const models = Object.keys(S.leads[prov]);
  if (!models.includes(lead.model)) lead.model = S.leadDefault[prov].model;
  const efforts = S.leads[prov][lead.model];
  if (!efforts.includes(lead.effort)) lead.effort = efforts.includes(S.leadDefault[prov].effort) ? S.leadDefault[prov].effort : 'medium';
}

// --- Workers: rows built from the lead account's table; pickers edit it in place ---
function workers() {
  const rows = el('div', 'card');
  for (const r of table().roles) {
    const row = el('div', 'wrow');
    const role = el('div', 'role');
    if (r.role === 'implementer') {
      if (r.runs === 'external' && !subagents()) Object.assign(r, {runs: 'native', model: S.defaultModel[prov], effort: 'medium'});
      role.append('implementer', el('small', null, subagents() ? 'native or external' : 'always native'));
    } else {
      const name = el('input');
      name.value = r.role; name.placeholder = 'role name'; name.spellcheck = false; name.setAttribute('aria-label', 'Role name');
      name.oninput = () => { r.role = name.value.trim().toLowerCase(); };
      role.append(name);
    }
    const groups = [{who: leadName(), acc: [prov, leadIdx], options: opts(Object.keys(S.models[prov])).map(o => ({...o, value: 'native|' + o.value}))}];
    if ((r.role !== 'implementer' || subagents()) && ext().length) groups.push({who: extName(), acc: [OTHER[prov], extIndex()], options: opts(Object.keys(S.models[OTHER[prov]])).map(o => ({...o, value: 'external|' + o.value}))});
    const pick = v => {
      [r.runs, r.model] = v.split('|');
      if (!S.models[provOf(r.runs)][r.model].includes(r.effort)) r.effort = 'medium';
      renderDetail();
    };
    const runs = el('div', 'runs');
    for (const g of groups) runs.append(seg([g], `${r.runs}|${r.model}`, pick));
    const eff = seg([{acc: [provOf(r.runs), accOf(r.runs)], options: plain(S.models[provOf(r.runs)][r.model])}], r.effort, e => { r.effort = e; renderDetail(); });
    eff.classList.add('eff');
    row.append(role, runs);
    if (r.role !== 'implementer') {
      const x = el('button', 'x', '✕');
      x.type = 'button'; x.setAttribute('aria-label', 'Remove role');
      x.onclick = () => { table().roles.splice(table().roles.indexOf(r), 1); renderDetail(); };
      row.append(x);
    }
    row.append(eff);
    rows.append(row);
  }
  const tools = el('div', 'tools'), add = el('button', 'add', '+ Add role');
  add.type = 'button';
  add.onclick = () => {
    table().roles.push(ext().length ? {role: '', runs: 'external', model: S.defaultModel[OTHER[prov]], effort: 'medium'}
                                    : {role: '', runs: 'native', model: S.defaultModel[prov], effort: 'medium'});
    renderDetail();
    [...$('detail').querySelectorAll('.wrow input')].pop().focus();
  };
  tools.append(add);
  // External account: a picker only when the other CLI has more than one subscription.
  if (ext().length > 1) {
    const f = el('div', 'field');
    f.append(el('span', 'faint', 'external on'), seg(ext().map((a, i) => ({acc: [OTHER[prov], i], options: [{value: i, label: a.name}]})), extIndex(),
      i => { table().account = ext()[i].folder; renderDetail(); }));
    tools.append(f);
  }
  rows.append(tools);
  return rows;
}

// Each lead account keeps its own table: picking another account shows that one.
function selectLead(p, i, session = null) {
  resume = session;
  update = false;
  leadIdx = i;  // before rendering: the rows' labels read the lead's name
  if (p !== prov) {
    prov = p;
    const last = S.lead.provider === p ? S.lead : S.leadDefault[p];  // an invalid saved value falls back in fixLead
    Object.assign(lead, {model: last.model, effort: last.effort});
  }
  fixLead();
  renderDetail();
  renderList();
}

// --- Right pane: new session, then recent sessions by day; search and account chips filter them ---
fetch('sessions').then(r => r.json()).then(list => { sessions = list; renderChips(); renderList(); })
  .catch(() => { sessions = []; renderList(); $('list').lastChild.textContent = 'Could not read the sessions.'; });
const key = x => `${x.provider}|${x.account}`;
$('q').oninput = renderList;
function renderChips() {
  // Same order as the Lead account cards: Claude accounts, then Codex ones, each as listed.
  const keys = ['claude', 'codex'].flatMap(p => S.accounts[p].map((_, i) => `${p}|${i}`)).filter(k => sessions.some(x => key(x) === k));
  $('chips').replaceChildren();
  if (keys.length < 2) return;
  for (const k of ['all', ...keys]) {
    const [p, i] = k.split('|');
    const c = el('button', filter === k ? 'on' : '');
    c.type = 'button';
    if (k === 'all') c.textContent = 'All';
    else { tint(c, p, +i); c.append(el('span', 'dot'), accName(p, +i)); }
    c.onclick = () => { filter = k; renderChips(); renderList(); };
    $('chips').append(c);
  }
}
function ago(epoch) {
  const m = Math.round((Date.now() - epoch * 1000) / 60000);
  return m < 60 ? `${Math.max(1, m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}
function day(epoch) {
  const start = d => new Date(d).setHours(0, 0, 0, 0);
  const n = Math.round((start(Date.now()) - start(epoch * 1000)) / 864e5);
  return n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : n < 7 ? 'This week' : 'Older';
}
const shown = () => (sessions || []).filter(x => (filter === 'all' || key(x) === filter) && x.title.toLowerCase().includes($('q').value.trim().toLowerCase()));
function renderList() {
  const box = $('list');
  box.replaceChildren();
  const nw = tint(el('button', 'item new' + (resume ? '' : ' on')), prov, leadIdx);
  nw.type = 'button';
  nw.append(el('span', 'plus', '+'), el('span', 'title', 'New session'), el('span', 'ago', `on ${leadName()}`));
  nw.onclick = () => selectLead(prov, leadIdx);
  box.append(nw);
  if (sessions === null) return box.append(el('div', 'empty', 'Reading…'));
  const list = shown();
  if (!list.length) box.append(el('div', 'empty', !sessions.length ? 'No sessions started in this folder yet.' : $('q').value ? 'No sessions match.' : 'No sessions for this account.'));
  let last = null;
  for (const x of list) {
    if (day(x.time) !== last) box.append(el('div', 'day', last = day(x.time)));
    const row = tint(el('button', 'item' + (resume && resume.id === x.id ? ' on' : '')), x.provider, x.account);
    row.type = 'button';
    const meta = el('span', 'meta', accName(x.provider, x.account));
    if (peak(x.provider, x.account) >= 90) meta.append(' · ', el('span', 'warn', 'near limit'));
    row.append(el('span', 'dot'), el('span', 'title', x.title), el('span', 'ago', ago(x.time)), meta);
    row.onclick = () => selectLead(x.provider, x.account, x);
    box.append(row);
  }
  box.querySelector('.on')?.scrollIntoView({block: 'nearest'});
}

// ↑ ↓ walk New session and the listed sessions, even while typing in the search; ⏎ starts.
addEventListener('keydown', e => {
  if (e.target.matches('.wrow input')) return;
  // A letter typed outside the inputs opens the spotlight with it.
  if (e.key.length === 1 && e.key !== ' ' && !e.metaKey && !e.ctrlKey && !e.altKey && !e.target.matches('input')) { e.preventDefault(); return openSpot(e.key); }
  if (e.key === 'Enter') { e.preventDefault(); return $('start').click(); }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const order = [null, ...shown()], k = Math.max(0, order.findIndex(x => x && resume && x.id === resume.id));
  const next = order[Math.max(0, Math.min(order.length - 1, k + (e.key === 'ArrowDown' ? 1 : -1)))];
  next ? selectLead(next.provider, next.account, next) : selectLead(prov, leadIdx);
});

// --- Spotlight: an account by name, then ⏎ starts a new session on it with the model and table saved for it ---
let spotIdx = 0;
function spotMatches() {
  const q = $('spotq').value.trim().toLowerCase(), found = [];
  for (const p of ['claude', 'codex']) S.accounts[p].forEach((a, i) => {
    const n = a.name.toLowerCase();
    const rank = n === q ? 0 : n.startsWith(q) ? 1 : n.includes(q) ? 2 : p.startsWith(q) ? 3 : -1;  // "work" finds claude-work
    if (rank >= 0) found.push({p, i, rank});
  });
  return found.sort((a, b) => a.rank - b.rank);
}
function renderSpot() {
  const list = spotMatches(), box = $('spotlist');
  spotIdx = Math.min(spotIdx, Math.max(0, list.length - 1));
  box.replaceChildren();
  if (!list.length) box.append(el('div', 'empty', 'No account matches.'));
  list.forEach((m, k) => {
    const b = tint(el('button', 'spot-item' + (k === spotIdx ? ' on' : '')), m.p, m.i);
    b.type = 'button';
    const top = peak(m.p, m.i);
    b.append(el('span', 'dot'), el('b', null, S.accounts[m.p][m.i].name), el('span', 'faint', m.p === 'codex' ? 'Codex' : 'Claude Code'),
      top >= 90 ? el('span', 'warn', `${Math.round(top)}% used`) : el('span', 'faint', 'new session'));
    b.onclick = () => launch(m);
    box.append(b);
  });
}
function openSpot(text) {
  $('spot').hidden = false;
  $('spotq').value = text;
  $('spotq').focus();
  spotIdx = 0;
  renderSpot();
}
const closeSpot = () => { $('spot').hidden = true; $('spotq').blur(); };
function launch(m) {
  closeSpot();
  selectLead(m.p, m.i);
  $('start').click();
}
$('spotq').oninput = () => { spotIdx = 0; $('spotq').value ? renderSpot() : closeSpot(); };
$('spotq').onkeydown = e => {
  e.stopPropagation();  // the page's own keys (⏎ starts the selection, ↑ ↓ walk the list) stay out
  const list = spotMatches();
  if (e.key === 'Escape') closeSpot();
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); spotIdx = Math.max(0, Math.min(list.length - 1, spotIdx + (e.key === 'ArrowDown' ? 1 : -1))); renderSpot(); }
  else if (e.key === 'Enter' && list.length) { e.preventDefault(); launch(list[spotIdx]); }
};
$('spot').onclick = e => { if (e.target === $('spot')) closeSpot(); };

// Open on the claude account (or the first codex one, with no Claude login); its model and effort are the last ones picked for that CLI in this repo.
if (S.accounts.claude.length) selectLead('claude', Math.max(0, S.accounts.claude.findIndex(a => a.name === 'claude')));
else selectLead('codex', 0);

$('start').onclick = async () => {
  const body = {
    lead: {provider: prov, account: leadIdx, model: lead.model, effort: lead.effort, resume: resume && resume.id, update},
    roles: table().roles.filter(r => r.role),
    account: (ext()[extIndex()] || {}).folder ?? null,
  };
  const res = await fetch('confirm', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  if (res.ok) {
    const done = el('div');
    done.style.padding = '24px 26px';
    done.append(el('h1', null, resume ? `Resuming on ${leadName()}` : `Starting ${leadName()}`), el('p', 'faint', 'Back to the terminal. You can close this tab.'));
    document.body.replaceChildren(done);
    window.close();  // works for a tab with one history entry, as the launcher opens it; otherwise the message stays
  } else {
    $('status').textContent = 'Not valid: ' + ((await res.json()).error || res.status);
  }
};
</script>
</body>
